<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <title>Contato - Daniel Finotti</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="wrap">
        <main class="contact-page">
            <section class="contact-panel" aria-labelledby="contact-title">
                <header class="contact-header">
                    <img class="contact-avatar" src="img/logo.png" onerror="this.onerror=null;this.src='img/logo.jpg';" alt="Foto de Daniel Finotti">
                    <p class="section-label">FALE COMIGO</p>
                    <h1 id="contact-title">Contato</h1>
                    <p>Escolha uma das opções abaixo para entrar em contato.</p>
                </header>

                <div class="contact-links">
                    <a href="https://www.instagram.com/seu-usuario/" target="_blank" rel="noopener">
                        <i class="fa-brands fa-instagram"></i>
                        Instagram
                    </a>
                    <a href="https://github.com/seu-usuario" target="_blank" rel="noopener">
                        <i class="fa-brands fa-github"></i>
                        GitHub
                    </a>
                    <a href="mailto:seuemail@example.com?subject=Contato pelo site">
                        <i class="fa-solid fa-envelope"></i>
                        Enviar e-mail
                    </a>
                    <a href="https://wa.me/5500000000000" target="_blank" rel="noopener">
                        <i class="fa-brands fa-whatsapp"></i>
                        WhatsApp
                    </a>
                    <span>
                        <i class="fa-solid fa-location-dot"></i>
                        Sua cidade
                    </span>
                </div>

                <a class="back-link" href="index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar ao início
                </a>
            </section>
        </main>
    </div>
</body>
</html>
